<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VocaDine — Architecture Diagram</title>
<style>
  body {
    margin: 0; padding: 32px;
    background: #c8cfd8;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    font-size: 1.1rem; font-weight: 700; color: #0D1B2A;
    letter-spacing: 1px; margin-bottom: 4px;
  }
  p {
    font-size: 0.75rem; color: #555; margin-bottom: 24px;
  }
  .diagram-wrap {
    background: #F4F7FB;
    border-radius: 10px;
    box-shadow: 0 6px 32px rgba(0,0,0,0.2);
    padding: 36px 40px;
    width: 1100px;
  }
  @media print {
    @page { size: A3 landscape; margin: 12mm; }
    body { background: white; padding: 0; }
    .diagram-wrap { box-shadow: none; width: 100%; }
    .print-btn { display: none; }
  }
  .print-btn {
    position: fixed; bottom: 20px; right: 20px;
    background: #1B6CA8; color: white; border: none;
    padding: 10px 22px; font-size: 0.85rem; cursor: pointer;
    border-radius: 4px;
  }
</style>
</head>
<body>

<h1>VocaDine Germany — System Architecture</h1>
<p>DLMAIWNLPVA02 · NLP &amp; Voice 2 · Korbinian Much · 2026</p>

<div class="diagram-wrap">
<svg viewBox="0 0 1020 560" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;font-family:'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#1B6CA8"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#38A169"/>
    </marker>
    <marker id="ao" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#F59E0B"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0,7 3.5,0 7" fill="#E53E3E"/>
    </marker>
  </defs>

  <!-- ===================== LAYER LABELS ===================== -->
  <!-- top-right label -->
  <text x="1018" y="16" text-anchor="end" font-size="9.5" font-weight="700" fill="#0D1B2A">VocaDine Germany — System Architecture</text>
  <text x="1018" y="30" text-anchor="end" font-size="7.5" fill="#718096">DLMAIWNLPVA02 · NLP &amp; Voice 2 · Korbinian Much · 2026</text>

  <text x="8" y="52" font-size="7.5" fill="#aaa" font-weight="700" text-transform="uppercase" letter-spacing="1.5">INPUT</text>
  <text x="8" y="162" font-size="7.5" fill="#aaa" font-weight="700" letter-spacing="1.5">NLU</text>
  <text x="8" y="292" font-size="7.5" fill="#aaa" font-weight="700" letter-spacing="1.5">DIALOG</text>
  <text x="8" y="412" font-size="7.5" fill="#aaa" font-weight="700" letter-spacing="1.5">API + RANK</text>
  <text x="8" y="522" font-size="7.5" fill="#aaa" font-weight="700" letter-spacing="1.5">OUTPUT</text>

  <!-- layer separator lines -->
  <line x1="50" y1="68" x2="1010" y2="68" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="50" y1="195" x2="1010" y2="195" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="50" y1="330" x2="1010" y2="330" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="50" y1="450" x2="1010" y2="450" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ===================== ROW 1: INPUT ===================== -->
  <!-- Microphone -->
  <rect x="60" y="20" width="100" height="42" rx="21" fill="#4FC3F7"/>
  <text x="110" y="38" text-anchor="middle" font-size="9" font-weight="700" fill="#0D1B2A">Microphone</text>
  <text x="110" y="52" text-anchor="middle" font-size="8" fill="#0D1B2A">PCM 16kHz</text>

  <!-- arrow -->
  <line x1="160" y1="41" x2="198" y2="41" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="179" y="37" text-anchor="middle" font-size="7" fill="#718096">audio</text>

  <!-- STT box -->
  <rect x="200" y="10" width="160" height="62" rx="5" fill="#0D1B2A" stroke="#1B6CA8" stroke-width="1.5"/>
  <text x="280" y="28" text-anchor="middle" font-size="7.5" fill="#4FC3F7" font-weight="700" letter-spacing="1">STT</text>
  <text x="280" y="42" text-anchor="middle" font-size="8" fill="#E2E8F0">SpeechRecognition</text>
  <text x="280" y="54" text-anchor="middle" font-size="8" fill="#E2E8F0">Google Web Speech · en-US</text>
  <text x="280" y="66" text-anchor="middle" font-size="7" fill="#718096">pause_threshold=1.8s</text>

  <!-- arrow to NLU -->
  <line x1="280" y1="72" x2="280" y2="108" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="94" font-size="7" fill="#718096">raw transcript</text>

  <!-- City Whitelist (side input) -->
  <rect x="60" y="110" width="130" height="54" rx="5" fill="#EBF4FF" stroke="#1B6CA8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="125" y="128" text-anchor="middle" font-size="7.5" fill="#1B6CA8" font-weight="700">City Whitelist</text>
  <text x="125" y="141" text-anchor="middle" font-size="7.5" fill="#2d3748">2058+ German cities</text>
  <text x="125" y="153" text-anchor="middle" font-size="7" fill="#718096">phonetic aliases</text>

  <!-- ===================== ROW 2: NLU ===================== -->
  <!-- NLU container -->
  <rect x="200" y="108" width="440" height="80" rx="6" fill="#fff" stroke="#1B6CA8" stroke-width="1.5"/>
  <text x="420" y="124" text-anchor="middle" font-size="7.5" fill="#1B6CA8" font-weight="700" letter-spacing="1">NLU LAYER</text>

  <!-- spaCy NER sub-box -->
  <rect x="212" y="130" width="140" height="48" rx="4" fill="#0D1B2A" stroke="#4FC3F7" stroke-width="1.2"/>
  <text x="282" y="147" text-anchor="middle" font-size="7.5" fill="#4FC3F7" font-weight="700">spaCy NER</text>
  <text x="282" y="159" text-anchor="middle" font-size="7" fill="#E2E8F0">Primary · trained model</text>
  <text x="282" y="170" text-anchor="middle" font-size="7" fill="#718096">600 utterances · F1=0.881</text>

  <!-- Rule fallback sub-box -->
  <rect x="368" y="130" width="140" height="48" rx="4" fill="#EBF4FF" stroke="#1B6CA8" stroke-width="1.2"/>
  <text x="438" y="147" text-anchor="middle" font-size="7.5" fill="#1B6CA8" font-weight="700">Rule Fallback</text>
  <text x="438" y="159" text-anchor="middle" font-size="7" fill="#2d3748">Keyword maps · regex</text>
  <text x="438" y="170" text-anchor="middle" font-size="7" fill="#718096">budget / occasion / datetime</text>

  <!-- VADER sub-box -->
  <rect x="524" y="130" width="104" height="48" rx="4" fill="#FEF9EC" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="576" y="147" text-anchor="middle" font-size="7.5" fill="#D69E2E" font-weight="700">VADER</text>
  <text x="576" y="159" text-anchor="middle" font-size="7" fill="#2d3748">Sentiment</text>
  <text x="576" y="170" text-anchor="middle" font-size="7" fill="#718096">Impatience detect</text>

  <!-- city whitelist arrow into NLU -->
  <line x1="190" y1="137" x2="210" y2="148" stroke="#1B6CA8" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- arrow NLU → Dialog -->
  <line x1="420" y1="188" x2="420" y2="218" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="435" y="207" font-size="7" fill="#718096">slot dict</text>

  <!-- NLU labels (5 entity labels) -->
  <text x="660" y="120" font-size="7" fill="#718096">Entity labels:</text>
  <text x="660" y="133" font-size="7.5" fill="#1B6CA8">LOCATION</text>
  <text x="660" y="146" font-size="7.5" fill="#1B6CA8">CUISINE</text>
  <text x="660" y="159" font-size="7.5" fill="#1B6CA8">DIET</text>
  <text x="660" y="172" font-size="7.5" fill="#1B6CA8">BUDGET</text>
  <text x="660" y="185" font-size="7.5" fill="#1B6CA8">GROUP_SIZE</text>

  <!-- ===================== ROW 3: DIALOG ===================== -->
  <!-- Dialog container -->
  <rect x="120" y="218" width="740" height="106" rx="6" fill="#fff" stroke="#38A169" stroke-width="1.5"/>
  <text x="490" y="234" text-anchor="middle" font-size="7.5" fill="#38A169" font-weight="700" letter-spacing="1">DIALOG STATE MANAGER</text>

  <!-- Slot Filling -->
  <rect x="132" y="242" width="140" height="72" rx="4" fill="#0D1B2A" stroke="#38A169" stroke-width="1.2"/>
  <text x="202" y="259" text-anchor="middle" font-size="7.5" fill="#68D391" font-weight="700">Slot Filling</text>
  <text x="202" y="272" text-anchor="middle" font-size="7" fill="#E2E8F0">10 slots</text>
  <text x="202" y="284" text-anchor="middle" font-size="7" fill="#718096">implicit · up to 5/utterance</text>
  <text x="202" y="296" text-anchor="middle" font-size="7" fill="#718096">critical / optional / auto-skip</text>
  <text x="202" y="308" text-anchor="middle" font-size="7" fill="#718096">diet inference from past_exp</text>

  <!-- Validation Probe -->
  <rect x="288" y="242" width="140" height="72" rx="4" fill="#0D1B2A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="358" y="259" text-anchor="middle" font-size="7.5" fill="#F6AD55" font-weight="700">Validation Probe</text>
  <text x="358" y="272" text-anchor="middle" font-size="7" fill="#E2E8F0">High-impact slots:</text>
  <text x="358" y="284" text-anchor="middle" font-size="7" fill="#718096">location · cuisine · diet</text>
  <text x="358" y="296" text-anchor="middle" font-size="7" fill="#718096">0 results → rollback</text>
  <text x="358" y="308" text-anchor="middle" font-size="7" fill="#718096">1 retry with spelling hint</text>

  <!-- Ambiguity -->
  <rect x="444" y="242" width="140" height="72" rx="4" fill="#EBF4FF" stroke="#38A169" stroke-width="1.2"/>
  <text x="514" y="259" text-anchor="middle" font-size="7.5" fill="#1B6CA8" font-weight="700">Ambiguity Handler</text>
  <text x="514" y="272" text-anchor="middle" font-size="7" fill="#2d3748">≥2 cuisines detected</text>
  <text x="514" y="284" text-anchor="middle" font-size="7" fill="#718096">→ clarification question</text>
  <text x="514" y="296" text-anchor="middle" font-size="7" fill="#2d3748">Impatience trigger</text>
  <text x="514" y="308" text-anchor="middle" font-size="7" fill="#718096">VADER &lt; -0.5 → skip all</text>

  <!-- TTS Feedback loop -->
  <rect x="600" y="242" width="248" height="72" rx="4" fill="#FEF9EC" stroke="#38A169" stroke-width="1.2"/>
  <text x="724" y="259" text-anchor="middle" font-size="7.5" fill="#D69E2E" font-weight="700">TTS Confirmation Loop</text>
  <text x="724" y="272" text-anchor="middle" font-size="7" fill="#2d3748">"Got it — Berlin, Italian, 2 people..."</text>
  <text x="724" y="284" text-anchor="middle" font-size="7" fill="#718096">Reads back confirmed slots</text>
  <text x="724" y="296" text-anchor="middle" font-size="7" fill="#2d3748">Next unfilled slot question asked</text>
  <text x="724" y="308" text-anchor="middle" font-size="7" fill="#718096">edge-tts · en-US-JennyNeural</text>

  <!-- arrow Dialog → API -->
  <line x1="420" y1="324" x2="420" y2="352" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="435" y="342" font-size="7" fill="#718096">confirmed slots</text>

  <!-- ===================== ROW 4: API + RANKING ===================== -->
  <!-- Places API box -->
  <rect x="200" y="354" width="200" height="84" rx="5" fill="#0D1B2A" stroke="#1B6CA8" stroke-width="1.5"/>
  <text x="300" y="373" text-anchor="middle" font-size="7.5" fill="#4FC3F7" font-weight="700" letter-spacing="1">GOOGLE PLACES API</text>
  <text x="300" y="387" text-anchor="middle" font-size="7.5" fill="#E2E8F0">textQuery: cuisine + diet + city</text>
  <text x="300" y="399" text-anchor="middle" font-size="7" fill="#718096">fields: name · rating · priceRange</text>
  <text x="300" y="411" text-anchor="middle" font-size="7" fill="#718096">types · editorialSummary</text>
  <text x="300" y="423" text-anchor="middle" font-size="7" fill="#718096">reviews (top 3) · attributes</text>
  <text x="300" y="435" text-anchor="middle" font-size="7" fill="#F59E0B">max 50 venues returned</text>

  <!-- arrow Places → Ranking -->
  <line x1="400" y1="396" x2="438" y2="396" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="419" y="391" text-anchor="middle" font-size="7" fill="#718096">JSON</text>

  <!-- Ranking box -->
  <rect x="440" y="354" width="340" height="84" rx="5" fill="#fff" stroke="#1B6CA8" stroke-width="1.5"/>
  <text x="610" y="373" text-anchor="middle" font-size="7.5" fill="#1B6CA8" font-weight="700" letter-spacing="1">RECOMMENDATION ENGINE · scikit-learn TF-IDF</text>
  <!-- formula -->
  <rect x="452" y="380" width="316" height="26" rx="3" fill="#EBF4FF"/>
  <text x="610" y="395" text-anchor="middle" font-size="8" fill="#0D1B2A" font-weight="700">score = (cosine_sim × 0.4) + (rating/5.0 × 0.6) + budget_bonus + attr_bonus</text>
  <!-- inputs label -->
  <text x="452" y="420" font-size="7" fill="#718096">Restaurant features: name + types + editorialSummary + reviews + attribute tokens</text>
  <text x="452" y="432" font-size="7" fill="#718096">User features: cuisine + diet + occasion + past_experience free text</text>

  <!-- arrow Ranking → TTS output -->
  <line x1="610" y1="438" x2="610" y2="466" stroke="#38A169" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="625" y="456" font-size="7" fill="#718096">top 3 ranked</text>

  <!-- ===================== ROW 5: OUTPUT ===================== -->
  <!-- TTS output box -->
  <rect x="440" y="468" width="340" height="56" rx="28" fill="#4FC3F7"/>
  <text x="610" y="491" text-anchor="middle" font-size="9" font-weight="700" fill="#0D1B2A">TTS Output · edge-tts</text>
  <text x="610" y="506" text-anchor="middle" font-size="8" fill="#0D1B2A">en-US-JennyNeural · reads top 3 restaurants aloud</text>
  <text x="610" y="519" text-anchor="middle" font-size="7.5" fill="#0D1B2A">E2E latency ~6–9s (incl. API) · local processing ~1.8s</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="820" y="354" width="190" height="136" rx="5" fill="#fff" stroke="#CBD5E0" stroke-width="1"/>
  <text x="915" y="372" text-anchor="middle" font-size="7.5" fill="#0D1B2A" font-weight="700">LEGEND</text>
  <rect x="832" y="382" width="14" height="10" rx="2" fill="#0D1B2A" stroke="#1B6CA8" stroke-width="1.2"/>
  <text x="852" y="392" font-size="7.5" fill="#2d3748">Core component</text>
  <rect x="832" y="400" width="14" height="10" rx="2" fill="#EBF4FF" stroke="#1B6CA8" stroke-width="1.2"/>
  <text x="852" y="410" font-size="7.5" fill="#2d3748">Rule-based / fallback</text>
  <rect x="832" y="418" width="14" height="10" rx="2" fill="#FEF9EC" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="852" y="428" font-size="7.5" fill="#2d3748">Adaptive / sentiment</text>
  <rect x="832" y="436" width="14" height="10" rx="2" fill="#EBF4FF" stroke="#38A169" stroke-width="1.2"/>
  <text x="852" y="446" font-size="7.5" fill="#2d3748">Dialog control</text>
  <rect x="832" y="454" width="14" height="10" rx="25" fill="#4FC3F7"/>
  <text x="852" y="464" font-size="7.5" fill="#2d3748">I/O (voice)</text>
  <line x1="832" y1="477" x2="846" y2="477" stroke="#1B6CA8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="852" y="481" font-size="7.5" fill="#2d3748">Data flow</text>

</svg>
</div>

<button class="print-btn" onclick="window.print()">Print / Save PDF</button>

</body>
